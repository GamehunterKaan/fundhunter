name: Prices and contents

# What every page opens on: today's NAV for every fund, what each one holds by
# asset class, the benchmarks the tape runs, and the share index. Everything
# here is cheap against a warm cache — TEFAS is asked by date range, and only
# the newest range is ever new — so this is the job that runs every day.
#
# What is NOT here: the falls (weekly, in crashes.yml, because past falls do not
# change) and the KAP portfolio reports (holdings.yml, because a filing is
# monthly and the run only asks for the ones that could have moved).

on:
  schedule:
    # Twice, because a schedule is best-effort. GitHub has been creating these
    # runs four to twelve hours after the minute they name, and a fire it drops
    # outright would leave the site a day behind with nothing to say so.
    # Whichever lands first commits; the other finds nothing new and is gone in
    # about two minutes against a warm cache.
    #
    # 06:30 and 11:15 UTC ≈ 09:30 and 14:15 Europe/Istanbul. A fund's price for
    # the day is on TEFAS by mid-morning Istanbul rather than after the close,
    # so both of these ask for a day that already exists. 16:30 UTC is 19:30
    # Istanbul: that third weekday run is deliberately after Borsa Istanbul's
    # close so Yahoo history can be verified against TradingView's session.
    #
    # The morning fire moved from 06:15 on 2026-09-09, because publication is
    # not instant and landing inside it is what incident 10 was. Measured that
    # morning: 1,908 of 2,068 funds priced at 06:04Z, 2,045 by 07:42Z, and flat
    # from there. A later start is worth having, but it is not the fix — the
    # `heal` job below is, because no hour is late enough every day and picking
    # one would be the same unverified timing assumption that made the
    # watchdog's grace period a mute button.
    - cron: '30 6 * * 1-6'
    - cron: '15 11 * * 1-6'
    - cron: '30 16 * * 1-5'
  workflow_dispatch:
    inputs:
      months:
        description: 'Months of history to fetch'
        required: false
        default: '12'
      heal_attempt:
        description: 'Self-heal round; set by the heal job, not by hand'
        required: false
        default: '0'

permissions:
  contents: write

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # One data job at a time across all three workflows. They each run
    # build-analytics and commit the funds.json it writes, so two of them
    # finishing together would be two rewrites of the same lines and a rebase
    # that cannot resolve itself.
    #
    # Declared on the JOB rather than on the workflow so the `heal` job below
    # can spend half an hour waiting without holding the queue shut behind it —
    # concurrency groups are shared across the repo either way, so this still
    # serialises against holdings.yml and crashes.yml.
    concurrency:
      group: fundhunter-data
      cancel-in-progress: false

    # Whether this run landed inside TEFAS's publication window. Written by
    # fetch-tefas.mjs from the share of funds that had a row for today but no
    # price in it yet.
    outputs:
      partial: ${{ steps.fetch.outputs.partial }}
      lagging: ${{ steps.fetch.outputs.lagging }}

    steps:
      - uses: actions/checkout@v5
        with:
          # The tip as it is when this job STARTS, not the SHA from when the run
          # was queued, which is what checkout takes by default. The concurrency
          # group below can hold a job for the better part of an hour behind a
          # sibling data job — and that sibling spends the wait pushing to
          # data/. Regenerating on top of the stale pin leaves a push that can
          # only be rebased by merging two whole-file rewrites of the same
          # generated JSON, which is not a merge that can succeed: it cost a
          # day's prices on 2026-08-31.
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # The fetches cache every response by the date range it covers, and a past
      # range never changes. Without this the runner starts cold every night and
      # re-fetches a year of history to learn one new day — which is where the
      # 32 minutes went. KAP's PDFs are excluded: they are 1.3GB, and the
      # holdings job is built not to want them.
      - name: Restore the response cache
        uses: actions/cache@v4
        with:
          path: |
            .cache
            !.cache/kap
          key: tefas-${{ github.run_id }}
          restore-keys: |
            tefas-

      - name: Verify core logic before touching data
        run: npm test

      - name: Fetch TEFAS funds and history
        id: fetch
        run: node scripts/fetch-tefas.mjs --months=${{ github.event.inputs.months || '12' }}

      - name: Fetch benchmarks (BIST, FX, gold, money-market)
        run: node scripts/fetch-benchmarks.mjs

      # One request per market for the sector and the dividend yield of every
      # listing the funds hold. Optional by design — without data/sectors.json
      # the themes and yields are left out — so a bad minute here does not throw
      # away the history above.
      - name: Fetch sectors and dividend yields
        continue-on-error: true
        run: node scripts/fetch-sectors.mjs

      # One scanner request for the whole exchange, then one Yahoo request per
      # share for its history. The Yahoo cache has separate pre/post-close
      # generations, and the post-close one is accepted only when it contains
      # TradingView's actual session date. This step is required: a failed or
      # incomplete stock refresh must make the prices workflow red.
      - name: Fetch Borsa İstanbul shares and their history
        run: node scripts/fetch-stocks.mjs

      # After the shares, because it reads the logoid they bring back, and before
      # the commit so new marks travel with the data they belong to. Nothing on
      # the site needs it — every row falls back to a monogram — so a bad minute
      # on sixty small manager websites must not fail the run that has the
      # prices in it.
      - name: Fetch company and manager logos
        continue-on-error: true
        run: node scripts/fetch-logos.mjs

      - name: Build analytics
        run: node scripts/build-analytics.mjs

      - uses: ./.github/actions/commit-data
        with:
          message: update fund prices and contents

  # Finish the day that this run caught half-published.
  #
  # TEFAS stamps a row with the day's date as soon as it starts publishing and
  # fills the price in afterwards, so a run that lands inside that window writes
  # a real but incomplete day — honestly labelled since incident 10, and still a
  # chunk of the market sitting at yesterday's figure. The only fix is to ask
  # again later.
  #
  # Until now "later" meant the freshness watchdog noticing and dispatching a
  # re-run. That is a cron, and measured over the twelve fires before this was
  # written it lands every 123 to 290 minutes against a schedule of every 15 —
  # GitHub drops the rest. On 2026-09-09 the site sat 7.74% unpriced from 06:04Z
  # with no re-run at all by 07:42Z, which is the whole of the morning a reader
  # would have been looking at it.
  #
  # So the run that caused the problem owns the fix, rather than an external
  # timer that may not fire. It costs a runner sitting idle, which is free on a
  # public repo, and it holds no data lock while it waits.
  heal:
    needs: prices
    # `github.event.inputs` is null on a scheduled run, so an absent attempt
    # reads as zero. Three rounds of thirty minutes covers ninety minutes past
    # the first run; publication on 2026-09-09 was complete inside a hundred.
    if: >-
      needs.prices.outputs.partial == 'true' &&
      fromJSON(github.event.inputs.heal_attempt || '0') < 3
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: write

    steps:
      - name: Wait for TEFAS to finish publishing
        run: |
          echo "day was incomplete: ${{ needs.prices.outputs.lagging }}"
          sleep 1800

      - name: Ask again
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh has no git remote to infer from.
          GH_REPO: ${{ github.repository }}
        run: |
          next=$(( ${{ fromJSON(github.event.inputs.heal_attempt || '0') }} + 1 ))
          echo "self-heal round $next of 3"
          gh workflow run prices.yml \
            -f heal_attempt="$next" \
            -f months="${{ github.event.inputs.months || '12' }}"
