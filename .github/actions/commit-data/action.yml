name: Commit data
description: >
  Commit whatever changed under data/ and push it, surviving anything that
  landed on main while the job was running.

inputs:
  message:
    description: Commit subject, without the date
    required: true

runs:
  using: composite
  steps:
    # A fetch takes the better part of an hour, so anything pushed to main while
    # it runs leaves this checkout behind and the push is rejected as a
    # non-fast-forward — a whole day's data lost to a one-line commit landing at
    # the wrong moment. Rebasing first is safe here because these jobs only ever
    # touch data/ and only ever add to it.
    #
    # Shared by three workflows rather than pasted into each: a retry loop that
    # has to get "rebase, then push again" right is exactly the kind of thing
    # that drifts between copies until only one of them still works.
    - shell: bash
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add data
        git diff --staged --quiet && echo "nothing changed" && exit 0
        git commit -m "chore: ${{ inputs.message }} $(date -u '+%Y-%m-%d')"
        for attempt in 1 2 3; do
          git push && exit 0
          echo "push rejected, rebasing onto main (attempt $attempt)"
          git pull --rebase origin main
        done
        echo "::error::could not push after three attempts"
        exit 1
